services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak-album-figuritas
    command: start-dev --import-realm --hostname=http://localhost:8081 --hostname-strict=false
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

volumes:
  keycloak_data:
